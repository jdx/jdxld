name: release

# Builds the Apple Silicon linker used by mr-boxington and attaches it to the
# draft release created by release-plz. Manual dry runs build the same archive
# from an arbitrary ref without signing, notarizing, or touching a release.

permissions: {}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: false
        default: ""
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
    secrets:
      CERTIFICATES_P12:
        required: true
      CERTIFICATES_P12_PASS:
        required: true
      APPLE_API_KEY_P8:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release. May be empty for a dry run."
        required: false
        type: string
      ref:
        description: "Branch or SHA to build. Only allowed for a dry run."
        required: false
        type: string
      dry_run:
        description: "Build and retain the assets without signing or publishing."
        required: true
        default: true
        type: boolean

concurrency:
  group: release-assets-${{ inputs.tag != '' && inputs.tag || inputs.ref != '' && inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Validate release inputs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$TAG" ]; then
            echo "::error::a tag is required for a real release"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ -n "$REF" ]; then
            echo "::error::a ref override is only allowed for a dry run"
            exit 1
          fi

  build:
    name: aarch64-apple-darwin
    needs: validate-inputs
    runs-on: namespace-profile-endev-macos-arm64;overrides.cache-tag=cache
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Import macOS signing certificate
        if: ${{ !fromJSON(format('{0}', inputs.dry_run || false)) }}
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}

      - name: Build jdxld
        run: cargo build --profile dist --locked --package jdxld --target "$TARGET" --no-default-features --features macho

      - name: Sign macOS binary
        if: ${{ !fromJSON(format('{0}', inputs.dry_run || false)) }}
        env:
          BINARY: target/aarch64-apple-darwin/dist/jdxld
          IDENTITY: "Developer ID Application: Jeffrey Dickey (4993Y37DX6)"
        run: |
          codesign --force --sign "$IDENTITY" --options runtime --timestamp \
            --prefix dev.jdx. "$BINARY"
          codesign --verify --verbose=2 "$BINARY"

      - name: Notarize macOS binary
        if: ${{ !fromJSON(format('{0}', inputs.dry_run || false)) }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BINARY: target/aarch64-apple-darwin/dist/jdxld
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error::App Store Connect notarization credentials are required"
            exit 1
          fi

          key="$(mktemp -t jdxld-notary-key)"
          submission="$(mktemp -d -t jdxld-notary)/jdxld.zip"
          trap 'rm -rf "$key" "$(dirname "$submission")"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --norsrc --noextattr "$BINARY" "$submission"

          result="$(xcrun notarytool submit "$submission" \
            --key "$key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            --timeout 30m \
            --wait)"
          echo "$result"
          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status for submission $id"
            xcrun notarytool log "$id" \
              --key "$key" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi

      - name: Verify binary
        env:
          BINARY: target/aarch64-apple-darwin/dist/jdxld
        run: |
          test -x "$BINARY"
          file "$BINARY" | tee /dev/stderr | grep -q 'arm64'

      - name: Archive
        run: tar -czf "jdxld-${TARGET}.tar.gz" -C "target/${TARGET}/dist" jdxld

      - name: Attest release archive
        if: ${{ !fromJSON(format('{0}', inputs.dry_run || false)) }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: jdxld-aarch64-apple-darwin.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-aarch64-apple-darwin
          path: jdxld-aarch64-apple-darwin.tar.gz
          retention-days: 1
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: build
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Retain dry-run assets
        if: ${{ fromJSON(format('{0}', inputs.dry_run || false)) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jdxld-release-assets
          path: release-assets
          if-no-files-found: error

      - name: Attach to release
        if: ${{ !fromJSON(format('{0}', inputs.dry_run || false)) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              --generate-notes \
              --title "$TAG" \
              --verify-tag
          fi
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::refusing to replace assets on published release $TAG"
            exit 1
          fi
          gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber

      - name: Publish manually dispatched release
        if: ${{ github.event_name == 'workflow_dispatch' && !fromJSON(format('{0}', inputs.dry_run || false)) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
